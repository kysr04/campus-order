<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>饮品详情 - 一杯</title>
  <meta name="description" content="选择杯型、冰量、甜度和加料，价格实时计算。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧋</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="detail">

  <div class="promo">
    <div class="app-container">
      <span>🧋 新店开业：满 <b>20</b> 减 <b>3</b></span>
      <span>校内自提 · 不用排队</span>
    </div>
  </div>

  <header class="site-header">
    <div class="app-container">
      <a class="brand" href="index.html">
        <span class="brand-logo">🧋</span>
        <span>一杯<small>校园奶茶点单</small></span>
      </a>
      <nav class="main-nav">
        <a href="index.html">点单</a>
        <a href="history.html">订单</a>
        <a href="about.html">关于</a>
      </nav>
      <a class="cart-btn" href="cart.html" aria-label="购物车">
        🛒<span class="cart-badge js-cart-badge">0</span>
      </a>
    </div>
  </header>

  <main class="app-container page">
    <div class="detail-page">

      <div class="section-head" style="margin-bottom:10px">
        <a class="more" href="index.html">← 返回菜单</a>
        <a class="more" href="cart.html">去购物车 →</a>
      </div>

      <div id="detailRoot">
        <div class="detail-hero grad-1" id="detailHero"><span id="heroEmoji">🧋</span></div>
        <h1 class="detail-title" id="detailTitle">正在加载…</h1>
        <p class="detail-desc" id="detailDesc"></p>
        <div id="detailTags" style="display:flex;gap:6px;margin-bottom:6px"></div>

        <div class="spec-group">
          <div class="spec-label">杯型</div>
          <div class="opt-row" id="sizes"></div>
        </div>

        <div class="spec-group">
          <div class="spec-label">冰量</div>
          <div class="opt-row" id="ices"></div>
        </div>

        <div class="spec-group">
          <div class="spec-label">甜度</div>
          <div class="opt-row" id="sugars"></div>
        </div>

        <div class="spec-group">
          <div class="spec-label">加料 <span>可多选</span></div>
          <div class="opt-row" id="addons"></div>
        </div>

        <p class="sub" style="margin:18px 0 90px">中杯为基础价，大杯加 ¥3；加料可以任意组合。</p>
      </div>

      <div class="detail-action" id="detailAction" style="display:none">
        <div class="sum">
          <b>¥<span id="priceValue">0</span></b>
          <span>含所选规格</span>
        </div>
        <button class="btn btn-primary" id="btnAdd">加入购物车</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="app-container">
      <span>© <span class="js-year">2026</span> 一杯 · 校园奶茶点单</span>
      <span>课程作业演示 · 所有饮品与价格均为虚构</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
