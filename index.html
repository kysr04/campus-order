<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一杯 · 校园奶茶点单</title>
  <meta name="description" content="校园奶茶线上点单：选规格、加购物车、满 20 减 3，下单后出取餐号。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧋</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <div class="promo">
    <div class="app-container">
      <span>🧋 新店开业：满 <b>20</b> 减 <b>3</b></span>
      <span>校内自提 · 不用排队</span>
    </div>
  </div>

  <header class="site-header">
    <div class="app-container">
      <a class="brand" href="index.html">
        <span class="brand-logo">🧋</span>
        <span>一杯<small>校园奶茶点单</small></span>
      </a>
      <nav class="main-nav">
        <a href="index.html">点单</a>
        <a href="history.html">订单</a>
        <a href="about.html">关于</a>
      </nav>
      <a class="cart-btn" href="cart.html" aria-label="购物车">
        🛒<span class="cart-badge js-cart-badge">0</span>
      </a>
    </div>
  </header>

  <main class="app-container page">

    <div class="shop-hero">
      <div>
        <span class="tag">今日推荐</span>
        <h1>一杯，刚好</h1>
        <p>手煮珍珠 · 手打柠檬 · 生椰拿铁</p>
      </div>
      <div class="big">🧋</div>
    </div>

    <div class="shop-layout">
      <div>
        <div class="chips" id="chips"></div>
        <div class="drink-grid" id="drinkGrid"></div>
      </div>

      <aside class="cart-panel" id="cartPanel">
        <h3>已选 <span id="panelCount">0</span> 件</h3>
        <div class="mini" id="panelItems"></div>
        <div class="totals" id="panelTotals"></div>
      </aside>
    </div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="info">
      <div class="sum" id="barSum">¥0</div>
      <div class="hint" id="barHint">还没选饮品</div>
    </div>
    <a class="btn btn-primary" href="cart.html" id="barCheckout">去结算</a>
  </div>

  <footer class="site-footer">
    <div class="app-container">
      <span>© <span class="js-year">2026</span> 一杯 · 校园奶茶点单</span>
      <span>课程作业演示 · 所有饮品与价格均为虚构</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
